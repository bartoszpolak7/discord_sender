plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.5.0.8588"
}

group = 'io.github.bartoszpolak7'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // combine model annotations (@NotBlank) with @Valid in ApiController for full validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'net.dv8tion:JDA:6.4.1'

    testImplementation "org.seleniumhq.selenium:selenium-java:4.52.0"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.browserstack:browserstack-java-sdk:1.80.0'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

tasks.register('e2eTest', Test) {
    useJUnitPlatform {
        includeTags 'e2e'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    doFirst {
        def sdk = configurations.bstackAgent.resolvedConfiguration.resolvedArtifacts
                .find { it.name == 'browserstack-java-sdk' }
        jvmArgs "-javaagent:${sdk.file}"
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

sonar {
  properties {
    property "sonar.projectKey", "bartoszpolak7_discord_sender"
    property "sonar.organization", "bartoszpolak7"
  }
}